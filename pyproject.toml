[project]
name = "brax-ppo-pipeline"
version = "0.1.0"
description = "Parallel GPU-accelerated PPO implementation using JAX and Brax"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "brax>=0.14.2",
    "distrax>=0.1.9",
    "flax>=0.12.10",
    "jax>=0.12.0",
    "jax-metal>=0.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optax>=0.2.8",
    "tqdm>=4.70.1",
    "wandb>=0.31.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.1",
    "pytest>=9.1.1",
    "mypy>=1.8.0",
    "jupyter>=1.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade
select = ["E", "F", "I", "UP"]
ignore = []

[tool.mypy]
ignore_missing_imports = true
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
